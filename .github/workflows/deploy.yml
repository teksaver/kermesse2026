name: Deploy via SFTP

on:
  push:
    branches: [ "main" ] # Se déclenche à chaque push sur la branche main
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          
      - name: Préparation du fichier .env.local (PROD)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          SMTP_USER_ENCODED="$(php -r 'echo rawurlencode((string) getenv("SMTP_USERNAME"));')"
          SMTP_PASS_ENCODED="$(php -r 'echo rawurlencode((string) getenv("SMTP_PASSWORD"));')"

          echo "APP_ENV='prod'" > .env.local
          echo "APP_SECRET='${{ secrets.APP_SECRET }}'" >> .env.local
          echo "DB_HOST='${{ secrets.DB_HOST }}'" >> .env.local
          echo "DB_NAME='${{ secrets.DB_NAME }}'" >> .env.local
          echo "DB_USER='${{ secrets.DB_USER }}'" >> .env.local
          echo "DB_PASS='${{ secrets.DB_PASS }}'" >> .env.local
          echo "WEBHOOK_SECRET='${{ secrets.WEBHOOK_SECRET }}'" >> .env.local
          echo "DEFAULT_URI='https://${{ secrets.SITE_URL }}'" >> .env.local
          echo "MAILER_DSN='smtp://${SMTP_USER_ENCODED}:${SMTP_PASS_ENCODED}@${SMTP_HOST}:587?encryption=tls'" >> .env.local
          echo "MAILER_FROM='${{ secrets.MAILER_FROM }}'" >> .env.local
          echo "MAILER_FROM_NAME='${{ secrets.MAILER_FROM_NAME }}'" >> .env.local
          echo "MAILER_ENVELOPE_SENDER='${{ secrets.MAILER_ENVELOPE_SENDER }}'" >> .env.local
          echo "AUTH_JWT_SECRET='${{ secrets.AUTH_JWT_SECRET }}'" >> .env.local
          echo "AUTH_LOGIN_LINK_TTL='900'" >> .env.local
          echo "AUTH_ACCESS_TOKEN_TTL='900'" >> .env.local
          echo "AUTH_REFRESH_TOKEN_TTL='2592000'" >> .env.local
          echo "AUTH_REFRESH_THRESHOLD='300'" >> .env.local

      - name: Install vendor dependencies
        env:
          APP_ENV: prod
          APP_DEBUG: 0
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Déploiement des fichiers via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          port: 115 # Port personnalisé pour le SFTP
          password: ${{ secrets.SFTP_PASSWORD }}
          # Utiliser './' pour inclure absolument les fichiers cachés comme .env !
          local_path: './'
          remote_path: '/' # Déploiement à la racine de l'hébergement
          sftp_only: true # Force l'utilisation pure du protocole SFTP sans commandes SSH
          args: '-o ConnectTimeout=5'

      - name: Exécution des migrations (Webhook)
        run: |
          curl --fail --show-error --silent -X POST "https://${{ secrets.SITE_URL }}/webhook/migrations" -d "secret=${{ secrets.WEBHOOK_SECRET }}"
