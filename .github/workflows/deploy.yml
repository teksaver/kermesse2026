name: Deploy via SFTP

on:
  push:
    branches: [ "main" ] # Se déclenche à chaque push sur la branche main
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Vérifier les secrets requis
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAILER_FROM: ${{ vars.MAILER_FROM }}
          MAILER_FROM_NAME: ${{ vars.MAILER_FROM_NAME }}
          MAILER_ENVELOPE_SENDER: ${{ vars.MAILER_ENVELOPE_SENDER }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          required_vars=(
            APP_SECRET
            DB_HOST
            DB_NAME
            DB_USER
            DB_PASS
            WEBHOOK_SECRET
            SITE_URL
            SMTP_HOST
            SMTP_USERNAME
            SMTP_PASSWORD
            MAILER_FROM
            MAILER_FROM_NAME
            MAILER_ENVELOPE_SENDER
            AUTH_JWT_SECRET
            SFTP_SERVER
            SFTP_USERNAME
            SFTP_PASSWORD
          )

          missing=()
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              missing+=("${var_name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi
          
      - name: Préparation du fichier .env.local (PROD)
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAILER_FROM: ${{ vars.MAILER_FROM }}
          MAILER_FROM_NAME: ${{ vars.MAILER_FROM_NAME }}
          MAILER_ENVELOPE_SENDER: ${{ vars.MAILER_ENVELOPE_SENDER }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
        run: |
          write_env() {
            key="$1"
            value="$2"
            escaped=$(printf "%s" "$value" | sed "s/'/'\"'\"'/g")
            printf "%s='%s'\n" "$key" "$escaped" >> .env.local
          }

          SMTP_USER_ENCODED="$(php -r 'echo rawurlencode((string) getenv("SMTP_USERNAME"));')"
          SMTP_PASS_ENCODED="$(php -r 'echo rawurlencode((string) getenv("SMTP_PASSWORD"));')"

          : > .env.local
          write_env APP_ENV "prod"
          write_env APP_SECRET "$APP_SECRET"
          write_env DB_HOST "$DB_HOST"
          write_env DB_NAME "$DB_NAME"
          write_env DB_USER "$DB_USER"
          write_env DB_PASS "$DB_PASS"
          write_env WEBHOOK_SECRET "$WEBHOOK_SECRET"
          write_env DEFAULT_URI "https://$SITE_URL"
          write_env MAILER_DSN "smtp://${SMTP_USER_ENCODED}:${SMTP_PASS_ENCODED}@${SMTP_HOST}:587?encryption=tls"
          write_env MAILER_FROM "$MAILER_FROM"
          write_env MAILER_FROM_NAME "$MAILER_FROM_NAME"
          write_env MAILER_ENVELOPE_SENDER "$MAILER_ENVELOPE_SENDER"
          write_env AUTH_JWT_SECRET "$AUTH_JWT_SECRET"
          write_env AUTH_LOGIN_LINK_TTL "900"
          write_env AUTH_ACCESS_TOKEN_TTL "900"
          write_env AUTH_REFRESH_TOKEN_TTL "2592000"
          write_env AUTH_REFRESH_THRESHOLD "300"

      - name: Install vendor dependencies
        env:
          APP_ENV: prod
          APP_DEBUG: 0
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Préparer le bundle de déploiement
        run: |
          mkdir -p deploy
          rsync -a \
            --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'var/' \
            --exclude 'node_modules/' \
            --exclude '.phpunit.cache/' \
            --exclude 'Dockerfile' \
            --exclude 'compose.yaml' \
            --exclude 'compose.override.yaml' \
            --exclude 'githubsetup.md' \
            --exclude 'LICENSE' \
            ./ deploy/

      - name: Préparer le bootstrap initial
        run: |
          mkdir -p bootstrap
          rsync -a \
            --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'var/' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude '.phpunit.cache/' \
            --exclude 'deploy/' \
            --exclude 'bootstrap/' \
            --exclude 'deploy-package.zip' \
            --exclude 'Dockerfile' \
            --exclude 'compose.yaml' \
            --exclude 'compose.override.yaml' \
            --exclude 'githubsetup.md' \
            --exclude 'LICENSE' \
            ./ bootstrap/

      - name: Créer l'archive de déploiement
        run: |
          rm -f deploy-package.zip
          cd deploy
          zip -rq ../deploy-package.zip .

      - name: Bootstrap des fichiers applicatifs
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          port: 115
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './bootstrap/.'
          remote_path: '/'
          sftp_only: true
          args: '-o ConnectTimeout=5'

      - name: Recharger le cache applicatif
        run: |
          probe_http_code=$(curl --show-error --silent --output webhook-probe-response.json --write-out "%{http_code}" -X POST "https://${{ vars.SITE_URL }}/deploy_probe.php" -d "secret=${{ secrets.WEBHOOK_SECRET }}")
          echo "Deploy probe HTTP status: $probe_http_code"
          echo "Deploy probe response:"
          if [ -s webhook-probe-response.json ]; then
            cat webhook-probe-response.json
          else
            echo "<empty response body>"
          fi
          if [ "$probe_http_code" -lt 200 ] || [ "$probe_http_code" -ge 300 ]; then
            exit 1
          fi

          http_code=$(curl --show-error --silent --output webhook-bootstrap-response.json --write-out "%{http_code}" -X POST "https://${{ vars.SITE_URL }}/index.php/webhook/migrations" -d "secret=${{ secrets.WEBHOOK_SECRET }}")
          echo "Webhook bootstrap HTTP status: $http_code"
          echo "Webhook bootstrap response:"
          if [ -s webhook-bootstrap-response.json ]; then
            cat webhook-bootstrap-response.json
          else
            echo "<empty response body>"
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi

      - name: Déploiement des fichiers via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          port: 115 # Port personnalisé pour le SFTP
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './deploy-package.zip'
          remote_path: '/' # Déploiement à la racine du projet ; le web root public reste /httpdocs
          sftp_only: true # Force l'utilisation pure du protocole SFTP sans commandes SSH
          args: '-o ConnectTimeout=5'

      - name: Déploiement et migrations (Webhook)
        run: |
          http_code=$(curl --show-error --silent --output webhook-deploy-response.json --write-out "%{http_code}" -X POST "https://${{ vars.SITE_URL }}/index.php/webhook/deploy" -d "secret=${{ secrets.WEBHOOK_SECRET }}")
          echo "Webhook deploy HTTP status: $http_code"
          echo "Webhook deploy response:"
          if [ -s webhook-deploy-response.json ]; then
            cat webhook-deploy-response.json
          else
            echo "<empty response body>"
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
